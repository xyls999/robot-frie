_BASE_: [  # 中文备注：二次训练主配置；从 0.90736 best 继续微调，重点补小火焰和左侧边缘 board。
  '../ppyoloe/ppyoloe_plus_crn_s_80e_coco.yml',  # 中文备注：当前启用的子 yml 路径，提供本配置继承的默认参数。
]  # 中文备注：列表边界，用于表示继承配置列表的开始或结束。
# 中文备注：空行，用于分隔配置块，让配置结构更清晰。
# 0.90736-safe baseline specialization.  中文备注：原始说明行，保留训练配置设计背景。
# Data basis from 405-image audit:  中文备注：原始说明行，保留训练配置设计背景。
# - battery recall is 126/126, so avoid aggressive changes that can hurt it.  中文备注：原始说明行，保留训练配置设计背景。
# - fire <4k area recall is 178/197; small fire is the main recall gap.  中文备注：原始说明行，保留训练配置设计背景。
# - board edge recall is 19/23; all 4 board FN are middle-left edge targets.  中文备注：原始说明行，保留训练配置设计背景。
# Validation uses jump_holdout_20260605, not a contiguous frame range.  中文备注：原始说明行，保留训练配置设计背景。
# 中文备注：空行，用于分隔配置块，让配置结构更清晰。
log_iter: 10  # 中文备注：日志打印间隔；小数据训练设为 10 可以更密集观察 loss 和速度。
snapshot_epoch: 2  # 中文备注：保存和评估间隔；这里设为 2 是为了捕捉早期最佳 checkpoint。
save_dir: output/firedetect_ppyoloe_plus_crn_s_0907base_768_smallfire_edgeboard_jump_holdout_20260605  # 中文备注：训练输出目录；best_model、model_final 和中间 epoch 都保存在这里。
weights: output/firedetect_ppyoloe_plus_crn_s_0907base_768_smallfire_edgeboard_jump_holdout_20260605/model_final  # 中文备注：默认评估或导出时读取的权重路径；训练时通常由 best_model 或 model_final 覆盖。
pretrain_weights: output/firedetect_ppyoloe_plus_crn_s_1000e/best_model.pdparams  # 中文备注：二次训练的初始化权重；这里从 0.90736 的 best_model 继续微调。
# 中文备注：空行，用于分隔配置块，让配置结构更清晰。
metric: COCO  # 中文备注：评估指标体系；COCO 会计算 AP、AP50、AP75、small/medium/large 等指标。
num_classes: 3  # 中文备注：检测类别数量；本赛题固定为 battery、board、fire 三类。
# 中文备注：空行，用于分隔配置块，让配置结构更清晰。
TrainDataset:  # 中文备注：训练集配置块；当前使用 jump_holdout_20260605 的 355 张训练图片。
  name: COCODataSet  # 中文备注：组件名称或数据集类型；COCODataSet 表示按 COCO JSON 读取标注。
  image_dir: images  # 中文备注：图片目录；相对于 dataset_dir 拼接得到真实图片路径。
  anno_path: annotations/jump_holdout_20260605/train.json  # 中文备注：标注 JSON 路径；相对于 dataset_dir，决定训练或验证使用哪一份 split。
  dataset_dir: dataset/firedetect_full_A_train_0908_restore  # 中文备注：数据集根目录；所有图片和标注路径都基于它解析。
  allow_empty: true  # 中文备注：是否允许空图进入数据集；保留空图可以压制背景误检。
  empty_ratio: 0.8  # 中文备注：空图采样比例；过高会压召回，过低会增加空图误检。
  data_fields: ['image', 'gt_bbox', 'gt_class', 'is_crowd']  # 中文备注：训练样本字段列表；模型训练需要图片、框、类别和 is_crowd 信息。
# 中文备注：空行，用于分隔配置块，让配置结构更清晰。
EvalDataset:  # 中文备注：验证集配置块；当前使用跳跃抽样的 50 张验证图片。
  name: COCODataSet  # 中文备注：组件名称或数据集类型；COCODataSet 表示按 COCO JSON 读取标注。
  image_dir: images  # 中文备注：图片目录；相对于 dataset_dir 拼接得到真实图片路径。
  anno_path: annotations/jump_holdout_20260605/val.json  # 中文备注：标注 JSON 路径；相对于 dataset_dir，决定训练或验证使用哪一份 split。
  dataset_dir: dataset/firedetect_full_A_train_0908_restore  # 中文备注：数据集根目录；所有图片和标注路径都基于它解析。
  allow_empty: true  # 中文备注：是否允许空图进入数据集；保留空图可以压制背景误检。
# 中文备注：空行，用于分隔配置块，让配置结构更清晰。
TestDataset:  # 中文备注：测试/导出数据集配置块；主要给导出和测试阶段提供数据集信息。
  name: ImageFolder  # 中文备注：组件名称或数据集类型；COCODataSet 表示按 COCO JSON 读取标注。
  anno_path: annotations/jump_holdout_20260605/test.json  # 中文备注：标注 JSON 路径；相对于 dataset_dir，决定训练或验证使用哪一份 split。
  dataset_dir: dataset/firedetect_full_A_train_0908_restore  # 中文备注：数据集根目录；所有图片和标注路径都基于它解析。
# 中文备注：空行，用于分隔配置块，让配置结构更清晰。
worker_num: 0  # 中文备注：数据加载进程数；Windows/Paddle 环境下设 0 更稳定。
eval_height: &eval_height 768  # 中文备注：验证和导出输入高度；当前固定 768 以保护小目标召回。
eval_width: &eval_width 768  # 中文备注：验证和导出输入宽度；当前固定 768 与安全基线保持一致。
eval_size: &eval_size [*eval_height, *eval_width]  # 中文备注：验证/测试 Resize 使用的尺寸数组；由 eval_height 和 eval_width 组成。
# 中文备注：空行，用于分隔配置块，让配置结构更清晰。
TrainReader:  # 中文备注：训练数据读取与增强流水线；决定 Decode、增强、多尺度和 batch 处理。
  sample_transforms:  # 中文备注：单张图片级 transform；通常包含 Decode、颜色扰动、翻转等。
    - Decode: {}  # 中文备注：读取并解码图片；所有训练/验证/测试流水线的第一步。
    # Low color jitter: keep fire/battery appearance stable.  中文备注：原始说明行，保留训练配置设计背景。
    - RandomDistort: {prob: 0.10}  # 中文备注：颜色扰动增强；当前低概率 0.10，避免过强扰动火焰颜色特征。
    # Helps left/right edge balance for board without changing object scale.  中文备注：原始说明行，保留训练配置设计背景。
    - RandomFlip: {prob: 0.5}  # 中文备注：水平翻转增强；用于增强左右边缘 board 的覆盖。
  batch_transforms:  # 中文备注：batch 级 transform；通常包含多尺度 Resize、归一化、维度变换和 PadGT。
    # High, narrow multiscale range: protects small fire while keeping 768 export.  中文备注：原始说明行，保留训练配置设计背景。
    - BatchRandomResize: {target_size: [736, 768, 800], random_size: true, random_interp: true, keep_ratio: false}  # 中文备注：训练多尺度策略；[736,768,800] 偏高尺寸，目标是提升小火焰召回。
    - NormalizeImage: {mean: [0., 0., 0.], std: [1., 1., 1.], norm_type: none}  # 中文备注：归一化配置；当前 mean=0、std=1，保持 PaddleDetection 导出链路一致。
    - Permute: {}  # 中文备注：通道维度变换；把 HWC 图像转换成模型需要的 CHW 格式。
    - PadGT: {}  # 中文备注：对 GT 框进行 padding；保证一个 batch 内不同目标数量可以对齐。
  batch_size: 4  # 中文备注：batch 图片数量；当前为 4，兼顾显存、速度和小数据训练稳定性。
  shuffle: true  # 中文备注：训练是否打乱样本；打开可以减少视频帧顺序带来的偏差。
  drop_last: true  # 中文备注：是否丢弃最后不足 batch 的样本；训练时打开可稳定 batch 形状。
  use_shared_memory: false  # 中文备注：是否使用共享内存；Windows 环境关闭更稳，减少 DataLoader 问题。
  collate_batch: true  # 中文备注：是否组装 batch；检测任务需要打开以处理多张图片输入。
# 中文备注：空行，用于分隔配置块，让配置结构更清晰。
EvalReader:  # 中文备注：验证阶段预处理流水线；不做随机增强，只做确定性 Resize/Normalize/Permute。
  sample_transforms:  # 中文备注：单张图片级 transform；通常包含 Decode、颜色扰动、翻转等。
    - Decode: {}  # 中文备注：读取并解码图片；所有训练/验证/测试流水线的第一步。
    - Resize: {target_size: *eval_size, keep_ratio: false, interp: 2}  # 中文备注：固定尺寸缩放；验证/测试阶段不能随机，保证指标可复现。
    - NormalizeImage: {mean: [0., 0., 0.], std: [1., 1., 1.], norm_type: none}  # 中文备注：归一化配置；当前 mean=0、std=1，保持 PaddleDetection 导出链路一致。
    - Permute: {}  # 中文备注：通道维度变换；把 HWC 图像转换成模型需要的 CHW 格式。
  batch_size: 1  # 中文备注：batch 图片数量；当前为 4，兼顾显存、速度和小数据训练稳定性。
# 中文备注：空行，用于分隔配置块，让配置结构更清晰。
TestReader:  # 中文备注：导出和推理阶段预处理流水线；必须与 predict.py 和 infer_cfg 保持一致。
  inputs_def:  # 中文备注：导出静态模型输入定义；决定最终 model.pdmodel 的输入形状。
    image_shape: [3, *eval_height, *eval_width]  # 中文备注：导出模型的固定输入 shape；[3,768,768] 对应 CHW 格式。
  sample_transforms:  # 中文备注：单张图片级 transform；通常包含 Decode、颜色扰动、翻转等。
    - Decode: {}  # 中文备注：读取并解码图片；所有训练/验证/测试流水线的第一步。
    - Resize: {target_size: *eval_size, keep_ratio: false, interp: 2}  # 中文备注：固定尺寸缩放；验证/测试阶段不能随机，保证指标可复现。
    - NormalizeImage: {mean: [0., 0., 0.], std: [1., 1., 1.], norm_type: none}  # 中文备注：归一化配置；当前 mean=0、std=1，保持 PaddleDetection 导出链路一致。
    - Permute: {}  # 中文备注：通道维度变换；把 HWC 图像转换成模型需要的 CHW 格式。
  batch_size: 1  # 中文备注：batch 图片数量；当前为 4，兼顾显存、速度和小数据训练稳定性。
# 中文备注：空行，用于分隔配置块，让配置结构更清晰。
epoch: 60  # 中文备注：训练总轮数；二次微调用 60 轮，实际选择 best_model 而不是 model_final。
# 中文备注：空行，用于分隔配置块，让配置结构更清晰。
LearningRate:  # 中文备注：学习率配置块；微调强模型时需要小学习率防止破坏已有能力。
  # Low LR for fine-tuning from the 0.90736 best checkpoint.  中文备注：原始说明行，保留训练配置设计背景。
  base_lr: 0.00004  # 中文备注：基础学习率；当前 4e-5 是从 0.907 best 继续微调的低风险设置。
  schedulers:  # 中文备注：学习率调度器列表；这里组合 CosineDecay 和 LinearWarmup。
    - name: CosineDecay  # 中文备注：组件名称或数据集类型；COCODataSet 表示按 COCO JSON 读取标注。
      max_epochs: 60  # 中文备注：学习率调度覆盖的 epoch 数；应与 epoch 保持一致。
    - name: LinearWarmup  # 中文备注：组件名称或数据集类型；COCODataSet 表示按 COCO JSON 读取标注。
      start_factor: 0.  # 中文备注：warmup 起始比例；0 表示从很低学习率开始升到 base_lr。
      epochs: 1  # 中文备注：调度器持续轮数；在 warmup 中表示升温 epoch 数。
# 中文备注：空行，用于分隔配置块，让配置结构更清晰。
OptimizerBuilder:  # 中文备注：优化器构建配置；定义 Momentum 优化器和 L2 正则。
  optimizer:  # 中文备注：优化器参数块；控制权重更新方式。
    momentum: 0.9  # 中文备注：动量系数；用于平滑梯度更新并提升收敛稳定性。
    type: Momentum  # 中文备注：组件类型字段；告诉 PaddleDetection 创建哪一种优化器、正则或 transform。
  regularizer:  # 中文备注：正则化参数块；控制权重衰减防止小数据过拟合。
    factor: 0.0002  # 中文备注：L2 正则强度；0.0002 是比 0.907 原始长训更温和的微调设置。
    type: L2  # 中文备注：组件类型字段；告诉 PaddleDetection 创建哪一种优化器、正则或 transform。
# 中文备注：空行，用于分隔配置块，让配置结构更清晰。
PPYOLOEHead:  # 中文备注：检测头配置；影响正样本分配、loss 权重和 NMS 后处理。
  # Short fine-tune from a trained detector: switch to dynamic assignment early.  中文备注：原始说明行，保留训练配置设计背景。
  static_assigner_epoch: 5  # 中文备注：静态分配器使用轮数；短微调设 5，让模型较早切到动态分配。
  loss_weight: {class: 1.25, iou: 2.7, dfl: 0.85}  # 中文备注：loss 权重；class/iou/dfl 的比例会影响分类召回和定位质量。
  assigner:  # 中文备注：TaskAlignedAssigner 配置块；决定 GT 与候选点的匹配方式。
    name: TaskAlignedAssigner  # 中文备注：组件名称或数据集类型；COCODataSet 表示按 COCO JSON 读取标注。
    topk: 15  # 中文备注：每个 GT 选择的候选正样本数量；增大有助于小目标正样本覆盖。
    alpha: 1.0  # 中文备注：分类分数权重；控制分类置信度在正样本分配中的影响。
    beta: 6.0  # 中文备注：定位分数权重；控制定位质量在正样本分配中的影响。
  nms:  # 中文备注：NMS 后处理配置；控制候选框过滤和重叠框抑制。
    name: MultiClassNMS  # 中文备注：组件名称或数据集类型；COCODataSet 表示按 COCO JSON 读取标注。
    nms_top_k: 1200  # 中文备注：NMS 前每类最多候选框数；较大值降低漏检风险但会略慢。
    keep_top_k: 400  # 中文备注：NMS 后整图最多保留框数；控制最终输出框数量上限。
    # Keep low pre-NMS score threshold; final filtering stays in predict.py.  中文备注：原始说明行，保留训练配置设计背景。
    score_threshold: 0.001  # 中文备注：NMS 前低分阈值；保持 0.001 避免提前丢掉潜在真阳性。
    # 405 audit has only 1 duplicate FP; use looser NMS to reduce close-fire suppression.  中文备注：原始说明行，保留训练配置设计背景。
    nms_threshold: 0.75  # 中文备注：NMS IoU 阈值；0.75 更不容易压掉相邻小火焰。
